<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
  <div>
    <label for="service-name" class="mb-1 block text-sm font-medium text-slate-700">
      Nombre <span class="text-red-500">*</span>
    </label>
    <input
      id="service-name"
      pInputText
      formControlName="name"
      placeholder="Consulta de medicina general"
      autocomplete="off"
      class="w-full"
    />
    @if (form.controls.name.touched && form.controls.name.invalid) {
      <p-message severity="error" size="small" variant="simple" styleClass="mt-1">
        El nombre es obligatorio (máximo 120 caracteres).
      </p-message>
    }
  </div>

  <div>
    <label for="service-description" class="mb-1 block text-sm font-medium text-slate-700">
      Descripción
    </label>
    <textarea
      id="service-description"
      pTextarea
      formControlName="description"
      rows="3"
      placeholder="Valoración médica general"
      class="w-full"
    ></textarea>
  </div>

  <div>
    <label for="service-status" class="mb-1 block text-sm font-medium text-slate-700">
      Estado
    </label>
    <p-select
      inputId="service-status"
      formControlName="status"
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      [fluid]="true"
    />
    @if (service()) {
      <p class="mt-1 text-xs text-slate-500">
        El estado de un servicio existente solo cambia con la baja lógica.
      </p>
    }
  </div>

  <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
    <button pButton type="button" severity="secondary" outlined (click)="cancelled.emit()">
      <span pButtonLabel>Cancelar</span>
    </button>
    <button pButton type="submit" [loading]="saving()">
      <i pButtonIcon class="pi pi-check"></i>
      <span pButtonLabel>Guardar</span>
    </button>
  </div>
</form>
